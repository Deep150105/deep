<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help & Support Form</title>
    <link rel="stylesheet" href="css/support.css">
</head>

<body>

    <h1>Help & Support Form</h1>

    <form action="#" method="GET">

        <fieldset>
            <legend>User Information</legend>

            <label>Name:</label>
            <input type="text" value="Jane Doe">

            <label>Password:</label>
            <input type="password" placeholder="Enter your student ID">

            <label>Number:</label>
            <input type="number" min="1" max="10">

            <label>Email:</label>
            <input type="email">
        </fieldset>

        <fieldset>
            <legend>Additional Details</legend>

            <label>Date:</label>
            <input type="date">

            <label>Time:</label>
            <input type="time">

            <label>Checkbox Options:</label>
            <div>
                <input type="checkbox"> Option 1
            </div>
            <div>
                <input type="checkbox"> Option 2
            </div>

            <label>Dropdown:</label>
            <select>
                <option>Value 1</option>
                <option>Value 2</option>
            </select>

            <label>Choose one (Radio):</label>
            <div><input type="radio" name="choice"> Option 1</div>
            <div><input type="radio" name="choice"> Option 2</div>

            <label>Text Area:</label>
            <textarea rows="4"></textarea>

            <label>Upload File:</label>
            <input type="file">
        </fieldset>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
