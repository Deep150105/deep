<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Events</title>
    <link rel="stylesheet" href="css/ctf.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <h2>HTB CTF</h2>
            <ul>
                <li>Ongoing</li>
                <li>Upcoming</li>
                <li>Joined</li>
                <li>Past</li>
            </ul>
        </div>

        <button class="build-btn">Build a CTF</button>
    </nav>

    <!-- SEARCH BAR -->
    <section class="search-section">
        <input type="text" placeholder="Search live capture the flag events">
    </section>

    <!-- GRID OF CTF CARDS -->
    <section class="ctf-grid">
        <div class="card">
            <img src="images/ctf 1.jpg" alt="CTF Try Out">
            <h3>CTF Try Out</h3>
            <p>01 Jan 2024 - 31 Dec 2024</p>
            <p class="players">6379 players joined</p>
        </div>

        <div class="card">
            <img src="images/mcp ctf.png" alt="MCP TryOut">
            <h3>MCP TryOut</h3>
            <p>24 Jul 2025 - 30 Dec 2025</p>
            <p class="players">140/200 players joined</p>
        </div>

        <div class="card">
            <img src="images/ctf 3.jpg" alt="Neurogrid CTF">
            <h3>Neurogrid CTF</h3>
            <p>30 Nov 2025 - 03 Dec 2025</p>
            <p class="players">113 players joined</p>
        </div>
    </section>
</body>
</html>
